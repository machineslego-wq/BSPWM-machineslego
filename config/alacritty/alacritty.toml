# ==========================================================
# Alacritty — конфиг с палитрой Tokyo Night и оболочкой fish
# ==========================================================

# ==========================================================
# --- ОБЩИЕ НАСТРОЙКИ ---
# ==========================================================
[general]
# Живое обновление конфига при сохранении (не требует перезапуска)
live_config_reload = true


# ==========================================================
# --- ОКНО ---
# ==========================================================
[window]
# Прозрачность (1.0 = полностью непрозрачное)
# Установлено 1.0 в соответствии с философией проекта (отказ от прозрачности).
# Если захотите включить, используйте например 0.9 (90% непрозрачности).
opacity = 1

dynamic_padding = true

# Внутренние отступы (x — по горизонтали, y — по вертикали)
padding = { x = 0, y = 8 }

# Стартовый размер окна
dimensions = { columns = 100, lines = 28 }

# Динамическое изменение заголовка окна
dynamic_title = true


# ==========================================================
# --- ПРОКРУТКА ---
# ==========================================================
[scrolling]
# Количество строк в истории (буфере обмена)
history = 10000
# Скорость прокрутки (множитель)
multiplier = 3


# ==========================================================
# --- ШРИФТ ---
# ==========================================================
[font]
size = 12
# Сдвиг шрифта (y = 1 немного опускает текст для лучшего вида)
offset = { x = 0, y = 1 }

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"


# ==========================================================
# --- ЦВЕТА: Tokyo Night ---
# ==========================================================

# Основные цвета фона и текста
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

# Цвет курсора (текст и сам блок)
[colors.cursor]
text   = "#1a1b26"
cursor = "#c0caf5"

# Курсор в режиме Vi (например, при поиске)
[colors.vi_mode_cursor]
text   = "#1a1b26"
cursor = "#bb9af7"

# Подсветка результатов поиска
[colors.search.matches]
foreground = "#1a1b26"
background = "#e0af68"

# Подсветка активного (сфокусированного) результата поиска
[colors.search.focused_match]
foreground = "#1a1b26"
background = "#9ece6a"

# Цвет нижней панели (footer) при поиске
[colors.footer_bar]
foreground = "#1a1b26"
background = "#c0caf5"

# Цвет выделения текста мышью
[colors.selection]
text       = "#1a1b26"
background = "#7aa2f7"

# Стандартные цвета ANSI (8 цветов)
[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

# Яркие цвета ANSI (8 цветов)
[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"


# ==========================================================
# --- КУРСОР ---
# ==========================================================
[cursor]
# Форма курсора: "Block" (блок), "Beam" (черта), "Underline" (подчеркивание)
style = { shape = "Block", blinking = "On" }
# Интервал мигания (в миллисекундах)
blink_interval = 500
# Делать курсор полым (контуром), когда окно не в фокусе
unfocused_hollow = true


# ==========================================================
# --- МЫШЬ ---
# ==========================================================
[mouse]
# Скрывать курсор мыши при наборе текста
hide_when_typing = true


# ==========================================================
# --- ОБОЛОЧКА ---
# ==========================================================
[terminal.shell]
program = "/usr/bin/fish"

# Если хочешь запускать fish как login-shell, раскомментируй строку ниже:
# args = ["-l"]