# =========================================================
# Picom — Эко-режим (без анимаций и теней)
# =========================================================

backend = "glx";
vsync = true;
blur-background = false;

# --- Отключаем всё тяжёлое ---
shadow = false;
fading = false;          # Отключает плавное появление/исчезновение
animations = false;      # Отключает анимации окон

# --- Углы: TUI-стиль, без скруглений ---
corner-radius = 0;
round-borders = 0;
no-ewmh-fullscreen = true;

# --- Правила ---
rules = (
    # Панели (Polybar и Dunst) — без скруглений и без теней
    {
        match = "class_g = 'Polybar' || class_g = 'Dunst'";
        corner-radius = 0;
        shadow = false;
    },
    # Все остальные окна — со скруглениями, но без теней
    {
        match = "class_g != 'Polybar' && class_g != 'Dunst'";
        shadow = false;
    }
);