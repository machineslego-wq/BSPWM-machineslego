# =========================================================
# Picom — композитор (BSPWM-machineslego)
# =========================================================

backend = "glx";
vsync = true;
blur-background = false;

# --- ТЕНИ (глобально) ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.6;

fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;

# --- Скругление углов ---
corner-radius = 15;
round-borders = 15;
no-ewmh-fullscreen = true;

# =========================================================
#   WINTYPES — дефолты для стандартных типов окон
# =========================================================
wintypes: {
    popup_menu    = { shadow = false; };
    dropdown_menu = { shadow = false; };
    menu          = { shadow = false; };
    tooltip       = { shadow = false; };
    utility       = { shadow = false; };
    combo         = { shadow = false; };
    dnd           = { shadow = false; };
};

# =========================================================
#   ПРАВИЛА И АНИМАЦИИ
# =========================================================
rules = (

    # =====================================================
    # 1. DUNST — выезд сверху
    # =====================================================
    {
        match = "class_g = 'Dunst'";
        corner-radius = 10;
        shadow = false;
        animations = (
            # --- ОТКРЫТИЕ: выезд сверху + проявление ---
            {
                triggers = ["open", "show"];
                offset-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.25;
                    start = "0 - window-height";
                    end = 0;
                }
                opacity = {
                    curve = "linear";
                    duration = 0.2;
                    start = 0;
                    end = 1;
                }
            },
            # --- ЗАКРЫТИЕ: уезд вверх + исчезновение ---
            {
                triggers = ["close", "hide"];
                offset-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0;
                    end = "0 - window-height";
                }
                opacity = {
                    curve = "linear";
                    duration = 0.2;
                    start = 1;
                    end = 0;
                }
            },
            # --- ГЕОМЕТРИЯ: сдвиг стека уведомлений ---
            {
                triggers = ["geometry"];
                offset-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 20;
                    end = 0;
                }
            }
        );
    },

    # =====================================================
    # 2. Qt/KDE-попапы (Telegram, VLC): без тени
    # =====================================================
    {
        match = "_NET_WM_WINDOW_TYPE@:a *= '_KDE_NET_WM_WINDOW_TYPE_OVERRIDE'";
        shadow = false;
    },

    # =====================================================
    # 3. TELEGRAM: без тени + анимации (OVERRIDE-тип)
    # =====================================================
    {
        match = "class_g = 'TelegramDesktop' || class_i = 'Telegram' || class_g *= 'elegram'";
        shadow = false;
        animations = (
            # --- ОТКРЫТИЕ: popin + fade ---
            {
                triggers = ["open"];
                opacity = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.7;
                    end = 1;
                }
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;
                    end = 1;
                }
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-opacity = "opacity";
            },
            # --- ЗАКРЫТИЕ: fade + shrink ---
            {
                triggers = ["close"];
                opacity = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0;
                }
                scale-x = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
                scale-y = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-opacity = "opacity";
            },
            # --- ГЕОМЕТРИЯ: тайлинг, свап ---
            {
                triggers = ["geometry"];
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-width-before / window-width";
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-height-before / window-height";
                    end = 1;
                }
                offset-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-x-before - window-x";
                    end = 0;
                }
                offset-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-y-before - window-y";
                    end = 0;
                }
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";
            }
        );
    },

    # =====================================================
    # 4. FIREFOX: без тени (анимации из общего правила)
    # =====================================================
    {
        match = "class_g = 'firefox' || class_g = 'Firefox' || class_g = 'Navigator' || class_g = 'firefox-esr'";
        shadow = false;
    },

    # =====================================================
    # 5. GTK-фреймы (Thunar и др.): без тени
    # =====================================================
    {
        match = "_GTK_FRAME_EXTENTS@";
        shadow = false;
    },

    # =====================================================
    # 6. ПАНЕЛИ (Polybar + Dunst): без скруглений, с тенью
    # =====================================================
    {
        match = "class_g = 'Polybar'";
        corner-radius = 0;
        shadow = true;
    },

    # =====================================================
    # 7. ROFI: плавное появление (только opacity)
    # =====================================================
    {
        match = "class_g = 'Rofi'";
        animations = (
            # --- ОТКРЫТИЕ: fade in ---
            {
                triggers = ["open"];
                opacity = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = 0;
                    end = 1;
                }
            },
            # --- ЗАКРЫТИЕ: fade out ---
            {
                triggers = ["close"];
                opacity = {
                    curve = "linear";
                    duration = 0.1;
                    start = 1;
                    end = 0;
                }
            }
        );
    },

    # =====================================================
    # 8. ОКНА: полный набор анимаций (всё, кроме Rofi/Polybar/Dunst)
    # =====================================================
    {
        match = "class_g != 'Rofi' && class_g != 'Polybar' && class_g != 'Dunst'";
        animations = (
            # --- ОТКРЫТИЕ: popin + fade ---
            {
                triggers = ["open"];
                opacity = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.7;
                    end = 1;
                }
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;
                    end = 1;
                }
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-opacity = "opacity";
            },
            # --- ЗАКРЫТИЕ: fade + shrink ---
            {
                triggers = ["close"];
                opacity = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0;
                }
                scale-x = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
                scale-y = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-opacity = "opacity";
            },
            # --- ГЕОМЕТРИЯ: тайлинг, свап ---
            {
                triggers = ["geometry"];
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-width-before / window-width";
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-height-before / window-height";
                    end = 1;
                }
                offset-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-x-before - window-x";
                    end = 0;
                }
                offset-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-y-before - window-y";
                    end = 0;
                }
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";
            }
        );
    }
);