# =========================================================
# Picom — композитор (BSPWM-machineslego)
# =========================================================

# =========================================================
#          --- Бэкенд и производительность ---
#       glx - тяжелее, но правильно работают скругления
#       xrender - легче, но скругления режутся
# =========================================================
backend = "glx";
vsync = true;

# Отключаем самые тяжёлые эффекты (в духе философии проекта)
blur-background = false;
shadow = false;

# ВАЖНО: fading должен быть true для анимаций прозрачности
fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;


# =========================================================
#               --- Скругление углов ---
# =========================================================
corner-radius = 15;
round-borders = 15;


# =========================================================
#                  --- Прозрачность ---
# =========================================================
# opacity-rule = [
#     "90:class_g = 'Alacritty'",
#     "90:class_g = 'Rofi'"
# ];


# =========================================================
#               --- Устранение артефактов ---
# =========================================================
no-ewmh-fullscreen = true;


# =========================================================
#               --- АНИМАЦИИ (Hyprland style) ---
# =========================================================
# easeOutQuint = cubic-bezier(0.23, 1.0, 0.32, 1.0)
# Это стандартная кривая Hyprland для окон.
# Если анимации будут "плавать" при перетаскивании — 
# уменьши duration у geometry до 0.08 или удали блок полностью.

rules = (
    # 1. Исключения: панели без скруглений и без анимаций
    {
        match = "class_g = 'Polybar' || class_g = 'Rofi' || class_g = 'Dunst'";
        corner-radius = 0;
    },

    # 2. ROFI: только плавное появление (без масштаба)
    # (чтобы рамка не резалась при анимации)
    {
        match = "class_g = 'Rofi'";
        animations = (
            {
                triggers = ["open"];
                opacity = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = 0;
                    end = 1;
                }
            },
            {
                triggers = ["close"];
                opacity = {
                    curve = "linear";
                    duration = 0.1;
                    start = 1;
                    end = 0;
                }
            }
        );
    },

    # 3. ОКНА: полный набор анимаций (open, close, geometry)
    {
        match = "class_g != 'Rofi' && class_g != 'Polybar' && class_g != 'Dunst'";
        animations = (
            # --- ОТКРЫТИЕ (popin в стиле Hyprland, 200ms) ---
            {
                triggers = ["open"];
                opacity = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.7;
                    end = 1;
                }
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;  # 80% (как windowsIn = popin 80%)
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;
                    end = 1;
                }
            },
            # --- ЗАКРЫТИЕ (150ms) ---
            {
                triggers = ["close"];
                opacity = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0;
                }
                scale-x = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
                scale-y = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
            },
            # --- ГЕОМЕТРИЯ (тайлинг, свап, 150ms) ---
            {
                triggers = ["geometry"];
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-width-before / window-width";
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-height-before / window-height";
                    end = 1;
                }
                offset-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-x-before - window-x";
                    end = 0;
                }
                offset-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-y-before - window-y";
                    end = 0;
                }
            }
        );
    }
);