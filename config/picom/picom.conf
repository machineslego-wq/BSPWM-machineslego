# =========================================================
#          --- Бэкенд и производительность ---
#       glx - тяжелее, но правильно работают скругления
#       xrender - легче, но скругления режутся
# =========================================================
backend = "glx";
vsync = true;

# Отключаем самые тяжёлые эффекты
blur-background = false;
shadow = false;
fading = false;

# =========================================================
#               --- Скругление углов ---
# =========================================================
corner-radius = 15;
round-borders = 15;
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'"
];
# =========================================================
#                  --- Прозрачность ---
# =========================================================
# opacity-rule = [
#     "100:class_g = 'Rofi'"
# ];

# =========================================================
#               -- Устранение артефактов ---
#    Помогает, если при выходе из полноэкранного режима 
#    пропадают скругления
# =========================================================
no-ewmh-fullscreen = true;