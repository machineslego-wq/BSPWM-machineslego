# =========================================================
# Picom — композитор (BSPWM-machineslego)
# =========================================================

backend = "glx";
vsync = true;

blur-background = false;

# --- ВКЛЮЧАЕМ ТЕНИ ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.6;

# ВАЖНО: fading должен быть true для анимаций прозрачности
fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;


# =========================================================
#               --- Скругление углов ---
# =========================================================
corner-radius = 15;
round-borders = 15;


# =========================================================
#               --- Устранение артефактов ---
# =========================================================
no-ewmh-fullscreen = true;


# =========================================================
#               --- АНИМАЦИИ (Hyprland style) ---
# =========================================================
rules = (
    # 1. Исключения: панели без скруглений, теней и анимаций
    {
        match = "class_g = 'Polybar' || class_g = 'Dunst'";
        corner-radius = 0;
        shadow = true;
    },

    # 2. ROFI: только плавное появление (без масштаба)
    {
        match = "class_g = 'Rofi'";
        animations = (
            {
                triggers = ["open"];
                opacity = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = 0;
                    end = 1;
                }
            },
            {
                triggers = ["close"];
                opacity = {
                    curve = "linear";
                    duration = 0.1;
                    start = 1;
                    end = 0;
                }
            }
        );
    },

    # 3. ОКНА: полный набор анимаций (open, close, geometry)
    {
        match = "class_g != 'Rofi' && class_g != 'Polybar' && class_g != 'Dunst'";
        animations = (
            # --- ОТКРЫТИЕ (popin в стиле Hyprland, 200ms) ---
            {
                triggers = ["open"];
                opacity = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.7;
                    end = 1;
                }
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.2;
                    start = 0.8;
                    end = 1;
                }
                # --- синхронизация тени с уже существующими свойствами ---
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-opacity = "opacity";
            },
            # --- ЗАКРЫТИЕ (150ms) ---
            {
                triggers = ["close"];
                opacity = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0;
                }
                scale-x = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
                scale-y = {
                    curve = "linear";
                    duration = 0.15;
                    start = 1;
                    end = 0.85;
                }
                # --- синхронизация тени ---
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-opacity = "opacity";
            },
            # --- ГЕОМЕТРИЯ (тайлинг, свап, 150ms) ---
            {
                triggers = ["geometry"];
                scale-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-width-before / window-width";
                    end = 1;
                }
                scale-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-height-before / window-height";
                    end = 1;
                }
                offset-x = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-x-before - window-x";
                    end = 0;
                }
                offset-y = {
                    curve = "cubic-bezier(0.23, 1, 0.32, 1)";
                    duration = 0.15;
                    start = "window-y-before - window-y";
                    end = 0;
                }
                # --- синхронизация тени ---
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";
            }
        );
    }
);