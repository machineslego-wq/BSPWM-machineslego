# =========================================================
# Picom — композитор (BSPWM-machineslego)
# =========================================================

# =========================================================
#          --- Бэкенд и производительность ---
#       glx - тяжелее, но правильно работают скругления
#       xrender - легче, но скругления режутся
# =========================================================
backend = "glx";
vsync = true;

# Отключаем самые тяжёлые эффекты (в духе философии проекта)
blur-background = false;
shadow = false;
fading = false;


# =========================================================
#               --- Скругление углов ---
# =========================================================
corner-radius = 15;
round-borders = 15;

# Окна, которые не должны скругляться
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'"
];


# =========================================================
#                  --- Прозрачность ---
# =========================================================
# Значение слева — процент непрозрачности (100 = полностью непрозрачно).
# Раскомментируйте блок ниже, чтобы включить эффект.
# 
# Рекомендации для тайлинга:
# - Терминал (Alacritty) — 90% (чтобы слегка просвечивали обои)
# - Лаунчер (Rofi) — 90%
# - Polybar и Dunst НЕ добавляем, у них свои настройки прозрачности/непрозрачности.

# opacity-rule = [
#     "90:class_g = 'Alacritty'",
#     "90:class_g = 'Rofi'"
# ];


# =========================================================
#               --- Устранение артефактов ---
# =========================================================
# Помогает, если при выходе из полноэкранного режима 
# пропадают скругления или окна отрисовываются неправильно.
no-ewmh-fullscreen = true;