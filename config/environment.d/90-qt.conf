# Платформенная тема Qt для GNOME-сессии.
# GDM не читает ~/.xprofile, поэтому без этой переменной Qt5/Qt6 в GNOME
# уходят в gtk3 (Adwaita) и палитры qt5ct/qt6ct не применяются.
# В Debian плагин libqt5ct.so регистрирует оба ключа ("qt5ct", "qt6ct"),
# так что qt6ct покрывает и Qt5, и Qt6.
# Sway/BSPWM перебивают значение своими сессионными скриптами (kde/qt6ct),
# Plasma — сбросом из /etc/xdg/plasma-workspace/env/ (его ставит kde-migrate).
# Файл линкуется поштучно: theme off убирает ссылку и возвращает сток GNOME.
QT_QPA_PLATFORMTHEME=qt6ct
