# Qt под Wayland: рамка окна как в GTK/Adwaita.
# Плагин libadwaita.so даёт пакет qt6-wayland.
QT_WAYLAND_DECORATION=adwaita

# Палитра Qt — qt6ct (Tokyo Night) во всех сессиях, включая GNOME.
# Без этого Qt на GNOME выбирает платформенную тему gtk3 и красится
# в Adwaita (светлее), игнорируя config/qt6ct.
QT_QPA_PLATFORMTHEME=qt6ct
