; ==========================================================
; GTK 4 — настройки тем и шрифтов (Tokyo Night rice)
; ==========================================================
; Примечание: GTK4 читает эти настройки только при старте приложения.
; Некоторые приложения (например, Nautilus 46+) предпочитают
; системные настройки через gsettings. Если тема не применяется
; в конкретной программе — это ограничение приложения, а не конфига.

[Settings]
; --- Тема оформления ---
gtk-theme-name = Adwaita-dark
gtk-application-prefer-dark-theme = 1

; --- Иконки ---
gtk-icon-theme-name = Papirus-Dark

; --- Курсор ---
gtk-cursor-theme-name = Bibata-Modern-Ice
gtk-cursor-theme-size = 24

; --- Шрифт интерфейса ---
gtk-font-name = JetBrainsMono Nerd Font 10