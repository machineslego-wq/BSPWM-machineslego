# ==========================================================
# foot — терминал по умолчанию для Sway
# ==========================================================
# Аналог config/alacritty: та же палитра Tokyo Night, тот же
# шрифт и та же оболочка. Живёт в репозитории:
# config/foot -> ~/.config/foot
#
# У foot нет живого перечитывания конфига: правка действует
# со следующего запуска терминала. Проверка синтаксиса:
#   foot -C -c ~/.config/foot/foot.ini
# ==========================================================

# ==========================================================
# --- ОКНО И ОБОЛОЧКА ---
# ==========================================================
[main]
term=foot

# Шрифт как в Alacritty: JetBrainsMono Nerd Font, size 10
font=JetBrainsMono Nerd Font:size=10

# Отступы: 0 по горизонтали, 8 по вертикали — как padding = { x = 0, y = 8 }
pad=0x8

# Стартовый размер: 100x28 символов, как dimensions в Alacritty
initial-window-size-chars=100x28

# Оболочка
shell=/usr/bin/fish


# ==========================================================
# --- ПРОКРУТКА ---
# ==========================================================
[scrollback]
lines=10000
multiplier=3.0


# ==========================================================
# --- КУРСОР ---
# ==========================================================
[cursor]
style=block
blink=yes
# Полый курсор в неактивном окне (unfocused_hollow в Alacritty)
unfocused-style=hollow
# Текст курсора и сам блок: #1a1b26 на #c0caf5
color=1a1b26 c0caf5


# ==========================================================
# --- ЦВЕТА: Tokyo Night ---
# ==========================================================
[colors]
# Прозрачность в проекте отвергнута (opacity = 1 в Alacritty)
alpha=1.0

background=1a1b26
foreground=c0caf5

# Обычные ANSI-цвета
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

# Яркие ANSI-цвета
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

# Выделение мышью (selection в Alacritty)
selection-foreground=1a1b26
selection-background=7aa2f7


# ==========================================================
# --- ДЕКОРАЦИИ ---
# ==========================================================
# Рамку рисует Sway (default_border pixel 2), поэтому собственный
# заголовок и рамку foot не показывает — иначе будет двойная обводка.
[csd]
preferred=none
size=0
border-width=0
