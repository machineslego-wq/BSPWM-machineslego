[General]
name=Tokyo Night
version=1.0
author=machineslego
description=Tokyo Night theme for CopyQ

[Theme]
; --- Основные цвета интерфейса ---
bg=#1a1b26
fg=#c0caf5
sel_bg=#33467c
sel_fg=#c0caf5
alt_bg=#24283b
font=JetBrainsMono Nerd Font,11,-1,5,50,0,0,0,0,0

; --- Стили для различных элементов ---
; Главное окно
main_window_css="background-color: ${bg}; color: ${fg};"

; Список элементов (сам список буфера обмена)
items_css="background-color: ${bg}; color: ${fg}; selection-background-color: ${sel_bg}; selection-color: ${sel_fg}; alternate-background-color: ${alt_bg};"

; Поле поиска и редактор
edit_css="background-color: ${bg}; color: ${fg}; selection-background-color: ${sel_bg}; selection-color: ${sel_fg};"

; Вкладки (Tabs)
tab_bar_css="background-color: ${alt_bg};"
tab_bar_tab_css="background-color: ${alt_bg}; color: ${fg}; padding: 4px 10px;"
tab_bar_tab_selected_css="background-color: ${bg}; color: ${fg}; border-bottom: 2px solid #7aa2f7;"

; Меню (Menu)
menu_css="background-color: ${alt_bg}; color: ${fg}; border: 1px solid #292e42;"
menu_item_css="padding: 4px 8px;"
menu_item_selected_css="background-color: ${sel_bg}; color: ${sel_fg};"

; Кнопки на панели инструментов
tool_bar_css="background-color: ${alt_bg}; border-bottom: 1px solid #292e42;"
tool_button_css="background-color: ${alt_bg}; color: ${fg}; border: none; padding: 4px;"
tool_button_hover_css="background-color: #2f334d;"

; Полоса прокрутки (Scrollbar)
scrollbar_css="background: ${bg}; width: 10px;"
scrollbar_handle_css="background: #414868; border-radius: 5px;"
scrollbar_handle_hover_css="background: #565f89;"