;==========================================================

;==========================================================
;               --- ЦВЕТА (Tokyo Night) ---
;==========================================================

[colors]
; --- Базовые ---
background      = #1a1b26
background-alt  = #24283b
foreground      = #c0caf5
primary         = #7aa2f7
secondary       = #bb9af7
alert           = #f7768e
warning         = #e0af68
disabled        = #565f89

; --- Семантические цвета (для статусов) ---
; Зеленый (успех, полная батарея, активное соединение)
success         = #9ece6a
; Голубой/Циан (информация, ссылки, яркость)
info            = #7dcfff
; Оранжевый (второй уровень предупреждения, или для контраста)
orange          = #ff9e64
; Темно-красный (критическая ошибка)
error           = #db4b4b
; Бирюзовый/Мятный (альтернативный акцент)
teal            = #73daca
; Глубокий фиолетовый (альтернатива secondary)
purple          = #9d7cd8

; --- Дополнительные фоны (для углубления) ---
; Самый темный фон (например, для всплывающих окон)
bg-dark         = #16161e
; Фон для подсветки строк или активных элементов
bg-highlight    = #292e42

; --- Текст ---
; Приглушенный текст (чуть темнее основного)
text-muted      = #a9b1d6


;==========================================================
;--- ГЛАВНАЯ ПАНЕЛЬ: Docked Panel (Full-width, no gaps) ---
;==========================================================
[bar/main]

; Настройки локали для панели и даты
locale = ru_RU.UTF-8

width = 100%
radius = 0
offset-x = 0
offset-y = 0
border-size = 0
height = 32px

; Фон с прозрачностью
background = #e61a1b26
foreground = ${colors.foreground}

; Высоты нижнего подчеркивания для например выбора рабочих
; пространств или для чего либо еще
line-size = 2

padding-left = 0
padding-right = 0

module-margin = 0

separator =
separator-foreground = ${colors.disabled}

; --- Шрифт ---
font-0 = JetBrainsMono Nerd Font;2

; --- Активные модули ---
modules-left = bspwm
modules-center = brightness date battery
modules-right = systray power-profile eth wlan pulseaudio xkeyboard powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm

;==========================================================
;                    --- МОДУЛИ ---
;==========================================================

; --- Рабочие столы BSPWM ---
[module/bspwm]
type = internal/bspwm

ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7

format = <label-state>

label-focused = %icon%

; =========================================================
;        --- Простое выделение акцентным цветом ---
; =========================================================

label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}

; =========================================================
; --- Слабое выделение с подчеркиванием акцентным цветом --
; =========================================================

; label-focused-background = ${colors.background-alt}
; label-focused-underline = ${colors.primary}

label-focused-padding = 2

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = %icon%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

; --- Яркость ---
[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
tail = true
label = %output%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

; =========================================================
;  --- Модуль баттареи на скрипте (автоматизированный) ---
; =========================================================

; --- Батарея ---
; [module/battery]
; type = custom/script
; exec = ~/.config/polybar/scripts/battery.sh
; tail = true
; label = %output%
; label-background = ${colors.background-alt}
; label-padding = 1

; =========================================================
;    --- Модуль баттареи стоковый (через launch.sh) ---
; =========================================================

[module/battery]
type = internal/battery

battery = ${env:POLYBAR_BAT:BAT0}
adapter = ${env:POLYBAR_AC:AC}

full-at = 100
poll-interval = 3

; --- ФОРМАТЫ ВЫВОДА ---
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

; --- ФОН И ОТСТУПЫ ---
format-charging-background = ${colors.background-alt}
format-charging-padding = 1

format-discharging-background = ${colors.background-alt}
format-discharging-padding = 1

format-full-background = ${colors.background-alt}
format-full-padding = 1

; --- ЦВЕТА ТЕКСТА ---
; При разрядке текст светлый (foreground), чтобы было хорошо видно
label-discharging-foreground = ${colors.foreground}

; При зарядке и полном заряде текст зеленый (success)
format-charging-foreground = ${colors.success}
format-full-foreground = ${colors.success}

; --- ТЕКСТ ---
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

; --- АНИМАЦИЯ ЗАРЯДКИ ---
animation-charging-0 = 󰂆
animation-charging-1 = 󰂇
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂋
animation-charging-6 = 󰂅
animation-charging-framerate = 600

; --- ИКОНКИ РАЗРЯДКИ (10 уровней) ---
ramp-capacity-0 = 󰂃
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹

; --- ЦВЕТА ИКОНОК ПРИ РАЗРЯДКЕ ---
; 0-3 (0-29%): Красный (alert)
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.alert}
ramp-capacity-2-foreground = ${colors.alert}
; 4-6 (30-59%): Желтый (warning)
ramp-capacity-3-foreground = ${colors.warning}
ramp-capacity-4-foreground = ${colors.warning}
ramp-capacity-5-foreground = ${colors.warning}
; 7-10 (60-100%): Синий (primary) — как ты и хотел по умолчанию
ramp-capacity-6-foreground = ${colors.primary}
ramp-capacity-7-foreground = ${colors.primary}
ramp-capacity-8-foreground = ${colors.primary}
ramp-capacity-9-foreground = ${colors.primary}
ramp-capacity-10-foreground = ${colors.primary}

; --- Системный трей  ---
[module/systray]
type = internal/tray
format-margin = 1
tray-spacing = 16
tray-maxsize = 18
tray-size = 18

; --- Дата ---
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %H:%M:%S | %d.%m.%Y | %a %d %b
label = %date%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1

; --- Раскладка + индикаторы ---
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-layout-padding = 2
label-layout-margin = 0

label-indicator-padding = 2
label-indicator-margin = 0
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

; --- Кнопка питания (раскрывное меню) ---
[module/powermenu]
type = custom/menu
expand-right = false

label-open = 󰤆
label-open-background = ${colors.primary}
label-open-foreground = ${colors.background}
label-open-padding = 2

label-close = 󰅖
label-close-background = ${colors.alert}
label-close-foreground = ${colors.background}
label-close-padding = 2

; --- Кнопки меню (раскрытие влево) ---
menu-0-2 = 󰍃
menu-0-2-background = ${colors.secondary}
menu-0-2-foreground = ${colors.background}
menu-0-2-padding = 2
menu-0-2-exec = ~/.config/sxhkd/scripts/powermenu.sh logout

menu-0-1 = 󰜉
menu-0-1-background = ${colors.warning}
menu-0-1-foreground = ${colors.background}
menu-0-1-padding = 2
menu-0-1-exec = ~/.config/sxhkd/scripts/powermenu.sh reboot

menu-0-0 = 󰐥
menu-0-0-background = ${colors.alert}
menu-0-0-foreground = ${colors.background}
menu-0-0-padding = 2
menu-0-0-exec = ~/.config/sxhkd/scripts/powermenu.sh poweroff

; --- Регулировка звука ---
[module/pulseaudio]
type = internal/pulseaudio

; Формат вывода
format-volume = <ramp-volume> <label-volume> <bar-volume>
format-muted  = <label-muted> <bar-volume>

; Внутренние отсутпы
format-muted-padding = 1
format-volume-padding = 1

; Иконки громкости — БЕЗ тегов внутри, они снаружи
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾
ramp-volume-4 = 󰕾

; Иконка мута — тоже без тегов внутри
label-muted = 󰝟 %percentage%%
label-muted-foreground = ${colors.disabled}

; Проценты — обычный шрифт (font-0 по умолчанию)
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

; Полоса прогресса
bar-volume-width = 5
bar-volume-foreground-0 = ${colors.primary}
bar-volume-foreground-1 = ${colors.primary}
bar-volume-foreground-2 = ${colors.primary}
bar-volume-foreground-3 = ${colors.primary}
bar-volume-foreground-4 = ${colors.primary}
bar-volume-foreground-5 = ${colors.primary}
bar-volume-foreground-6 = ${colors.warning}
bar-volume-foreground-7 = ${colors.warning}
bar-volume-foreground-8 = ${colors.warning}
bar-volume-foreground-9 = ${colors.alert}
bar-volume-foreground-10 = ${colors.alert}
bar-volume-gradient = false
bar-volume-indicator = ▓
bar-volume-indicator-font = 2
bar-volume-fill = ▓
bar-volume-fill-font = 2
bar-volume-empty = ▒
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.disabled}

; --- Модуль проводной сети ---
[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
format-disconnected = 
label-connected = 󰈀 %ifname%
format-connected-padding = 1

; --- Модули беспроводной сети ---
[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
label-connected = %essid%
label-disconnected = 󰤮
label-disconnected-padding = 1
format-connected-padding = 1

; --- Модуль выбора режима питания для ноутбуков ---
[module/power-profile]
type = custom/script
exec = ~/.config/polybar/scripts/power-profile.sh
; Запускать только если скрипт существует
exec-if = test -f ~/.config/polybar/scripts/power-profile.sh
interval = 5
label = %output%
label-foreground = ${colors.foreground}
label-padding = 1
click-left = ~/.config/polybar/scripts/power-profile.sh --menu &

;==========================================================
; НАСТРОЙКИ
;==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini