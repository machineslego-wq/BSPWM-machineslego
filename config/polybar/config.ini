; ========================================================================================================
;                                      --- ЦВЕТА (Tokyo Night) ---
; ========================================================================================================
; Справка по переменным:
;
; | Переменная       | HEX        | Назначение                                      |
; |------------------|------------|-------------------------------------------------|
; |                  |            | БАЗОВЫЕ (СТОКОВЫЕ)                              |
; |------------------|------------|-------------------------------------------------|
; | background       | #1a1b26  | Основной фон панели                             |
; | background-alt   | #24283b  | Фон модулей (пилюль) и вкладок                  |
; | foreground       | #c0caf5  | Основной цвет текста                            |
; | primary          | #7aa2f7  | Главный акцент (синий)                          |
; | secondary        | #bb9af7  | Вторичный акцент (фиолетовый)                   |
; | alert            | #f7768e  | Критический уровень (красный)                   |
; | warning          | #e0af68  | Предупреждение (желтый)                         |
; | disabled         | #565f89  | Неактивный/пустой элемент                       |
; |------------------|------------|-------------------------------------------------|
; |                  |            | СЕМАНТИЧЕСКИЕ (ДОПОЛНИТЕЛЬНЫЕ)                  |
; |------------------|------------|-------------------------------------------------|
; | success          | #9ece6a  | Успех, полная батарея, активное соединение      |
; | info             | #7dcfff  | Информация, ссылки, яркость                     |
; | orange           | #ff9e64  | Второй уровень предупреждения                   |
; | error            | #db4b4b  | Темно-красный (фатальная ошибка)                |
; | teal             | #73daca  | Бирюзовый/Мятный (альтернативный акцент)        |
; | purple           | #9d7cd8  | Глубокий фиолетовый (альтернатива secondary)    |
; |------------------|------------|-------------------------------------------------|
; |                  |            | ФОНЫ ДЛЯ УГЛУБЛЕНИЯ                             |
; |------------------|------------|-------------------------------------------------|
; | bg-dark          | #16161e  | Самый темный фон (всплывающие окна)             |
; | bg-highlight     | #292e42  | Фон для подсветки строк/элементов               |
; |------------------|------------|-------------------------------------------------|
; |                  |            | ТЕКСТ                                           |
; |------------------|------------|-------------------------------------------------|
; | text-muted       | #a9b1d6  | Приглушенный текст (чуть темнее основного)      |
; |------------------|------------|-------------------------------------------------|
; ========================================================================================================

[colors]
; --- Базовые (стоковые) ---
background      = #1a1b26
background-alt  = #24283b
foreground      = #c0caf5
primary         = #7aa2f7
secondary       = #bb9af7
alert           = #f7768e
warning         = #e0af68
disabled        = #565f89

; --- Семантические (дополнительные) ---
success         = #9ece6a
info            = #7dcfff
orange          = #ff9e64
error           = #db4b4b
teal            = #73daca
purple          = #9d7cd8

; --- Дополнительные фоны ---
bg-dark         = #16161e
bg-highlight    = #292e42

; --- Текст ---
text-muted      = #a9b1d6


; ========================================================================================================
;                                --- ГЛАВНАЯ ПАНЕЛЬ: Docked Panel ---
; ========================================================================================================
; Основные настройки верхней панели: геометрия, шрифты, список активных модулей.

[bar/main]

; Настройки локали для панели и даты
locale = ru_RU.UTF-8

; --- Геометрия панели ---
width = 100%
radius = 0
offset-x = 0
offset-y = 0
border-size = 0
height = 26px

; Фальшивые отступы сверху и снизу (по 4 пикселя),
; чтобы панель не прилипала к краям экрана.
border-top-size = 4
border-bottom-size = 4
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}

; --- Настройки фона ---
background      = #1a1b26
foreground = ${colors.foreground}

; Высота нижнего подчеркивания (например, для выбора рабочих пространств)
line-size = 2

; Внутренние отступы панели
padding-left = 1
padding-right = 1
module-margin = 0

; --- Шрифты ---
; font-0: Основной шрифт для текста панели
font-0 = JetBrainsMono Nerd Font:size=12;3
; font-1: Шрифт для иконок в "пилюлях"
font-1 = JetBrainsMono Nerd Font:pixelsize=15;4
; font-2: Мелкий шрифт для ползунков и прочего
font-2 = JetBrainsMono Nerd Font:size=12;3

; --- Расположение модулей ---
; Порядок блоков слева, по центру и справа.
; Модули разделяются пробелом, порядок в списке важен.
modules-left =  pill-left bspwm pill-right
modules-center = pill-left brightness date battery pill-right
modules-right = systray pill-left xkeyboard power-profile pulseaudio eth wlan powermenu pill-right

; Поведение курсора мыши
cursor-click = pointer
cursor-scroll = ns-resize

; Синхронизация с BSPWM (IPC)
enable-ipc = true
wm-restack = bspwm


; ========================================================================================================
;                                          --- МОДУЛИ ---
; ========================================================================================================


; ==========================================================
; --- Рабочие столы BSPWM ---
; ==========================================================
[module/bspwm]
type = internal/bspwm

; Иконки (Символ;Номер стола)
ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7
ws-icon-7 = VIII;8
ws-icon-8 = IX;9
ws-icon-9 = X;0

format = <label-state>

; --- Состояния рабочих столов ---
; Единый фон для всех состояний, чтобы сливались с "пилюлями".

; Активный (focused)
label-focused = %icon%
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-focused-margin = 0

; Занятый (occupied)
label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background-alt}
label-occupied-padding = 1
label-occupied-margin = 0

; Ургентный (urgent)
label-urgent = %icon%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-urgent-margin = 0

; Пустой (empty)
label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background-alt}
label-empty-padding = 1
label-empty-margin = 0


; ==========================================================
; --- Яркость (Brightness) ---
; ==========================================================
[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
tail = true
format = <label>
label = %output%
label-foreground = ${colors.foreground}
label-background = ${colors.background-alt}
label-padding = 1
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-


; ==========================================================
; --- Батарея (Battery) ---
; ==========================================================
; Используется стоковый модуль internal/battery.
; Переменные BAT0/AC подтягиваются из launch.sh (автоопределение).
; 
; АЛЬТЕРНАТИВА: если стоковый модуль не видит батарею,
; раскомментируйте скрипт ниже и закомментируйте блок [module/battery].
; [module/battery]
; type = custom/script
; exec = ~/.config/polybar/scripts/battery.sh
; tail = true
; label = %output%
; label-background = ${colors.background-alt}
; label-padding = 1

[module/battery]
type = internal/battery

battery = ${env:POLYBAR_BAT:BAT0}
adapter = ${env:POLYBAR_AC:AC}

full-at = 100
poll-interval = 3

; --- Форматы вывода ---
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

; --- Фон и отступы ---
format-charging-background = ${colors.background-alt}
format-charging-padding = 1

format-discharging-background = ${colors.background-alt}
format-discharging-padding = 1

format-full-background = ${colors.background-alt}
format-full-padding = 1

; --- Цвета текста ---
; При разрядке текст светлый (foreground)
label-discharging-foreground = ${colors.foreground}

; При зарядке и полном заряде текст зеленый (success)
format-charging-foreground = ${colors.success}
format-full-foreground = ${colors.success}

; --- Текст ---
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

; --- Анимация зарядки ---
animation-charging-0 = 󰂆
animation-charging-1 = 󰂇
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂋
animation-charging-6 = 󰂅
animation-charging-framerate = 600

; --- Иконки разрядки (10 уровней) ---
ramp-capacity-0 = 󰂃
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹

; --- Цвета иконок при разрядке ---
; 0-2 (0-29%): Красный (alert)
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.alert}
ramp-capacity-2-foreground = ${colors.alert}
; 3-5 (30-59%): Желтый (warning)
ramp-capacity-3-foreground = ${colors.warning}
ramp-capacity-4-foreground = ${colors.warning}
ramp-capacity-5-foreground = ${colors.warning}
; 6-10 (60-100%): Синий (primary)
ramp-capacity-6-foreground = ${colors.primary}
ramp-capacity-7-foreground = ${colors.primary}
ramp-capacity-8-foreground = ${colors.primary}
ramp-capacity-9-foreground = ${colors.primary}
ramp-capacity-10-foreground = ${colors.primary}


; ==========================================================
; --- Системный трей ---
; ==========================================================
[module/systray]
type = internal/tray
format-margin = 1
tray-spacing = 16
tray-maxsize = 18
tray-size = 18


; ==========================================================
; --- Дата и время ---
; ==========================================================
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %H:%M:%S | %d.%m.%Y | %a %d %b
label = %date%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1


; ==========================================================
; --- Раскладка клавиатуры + индикаторы (Num/Caps Lock) ---
; ==========================================================
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format =  <label-indicator><label-layout>

label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-layout-background = ${colors.background-alt}


label-layout-padding = 1
label-layout-margin = 0

label-indicator-padding = 1
label-indicator-margin = 0
label-indicator-foreground = ${colors.orange}
label-indicator-background = ${colors.background-alt}


; ==========================================================
; --- Кнопка питания (раскрывающееся меню) ---
; ==========================================================
[module/powermenu]
type = custom/menu
expand-right = false

label-open = 󰤆
label-open-background = ${colors.background-alt}
label-open-foreground = ${colors.primary}
label-open-padding = 2

label-close = 󰅖
label-close-background = ${colors.background-alt}
label-close-foreground = ${colors.alert}
label-close-padding = 2

; --- Кнопки меню (раскрытие влево) ---
menu-0-2 = 󰍃
menu-0-2-background = ${colors.background-alt}
menu-0-2-foreground = ${colors.secondary}
menu-0-2-padding = 2
menu-0-2-exec = ~/.config/sxhkd/scripts/powermenu.sh logout

menu-0-1 = 󰜉
menu-0-1-background = ${colors.background-alt}
menu-0-1-foreground = ${colors.warning}
menu-0-1-padding = 2
menu-0-1-exec = ~/.config/sxhkd/scripts/powermenu.sh reboot

menu-0-0 = 󰐥
menu-0-0-background = ${colors.background-alt}
menu-0-0-foreground = ${colors.alert}
menu-0-0-padding = 2
menu-0-0-exec = ~/.config/sxhkd/scripts/powermenu.sh poweroff


; ==========================================================
; --- Регулировка звука (PulseAudio) ---
; ==========================================================
[module/pulseaudio]
type = internal/pulseaudio

; Формат вывода
format-volume = <ramp-volume> <label-volume> <bar-volume>
format-muted  = <label-muted> <bar-volume>

; Фон для модуля
format-volume-background = ${colors.background-alt}
format-muted-background = ${colors.background-alt}

; Внутренние отступы
format-muted-padding = 1
format-volume-padding = 1

; Иконки громкости (без тегов внутри, они снаружи)
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾
ramp-volume-4 = 󰕾

; Иконка мута (тоже без тегов внутри)
label-muted = 󰝟 %percentage%%
label-muted-foreground = ${colors.disabled}

; Проценты (обычный шрифт, font-0)
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

; Полоса прогресса
bar-volume-width = 5
bar-volume-foreground-0 = ${colors.primary}
bar-volume-foreground-1 = ${colors.primary}
bar-volume-foreground-2 = ${colors.primary}
bar-volume-foreground-3 = ${colors.primary}
bar-volume-foreground-4 = ${colors.primary}
bar-volume-foreground-5 = ${colors.primary}
bar-volume-foreground-6 = ${colors.warning}
bar-volume-foreground-7 = ${colors.warning}
bar-volume-foreground-8 = ${colors.warning}
bar-volume-foreground-9 = ${colors.alert}
bar-volume-foreground-10 = ${colors.alert}
bar-volume-gradient = false

; Индикаторы в виде прямоугольников
# bar-volume-indicator      = █
# bar-volume-fill           = ▓
# bar-volume-empty          = ▒

; Индикаторы в виде кружков (текущий)
bar-volume-indicator      = •
bar-volume-fill           = •
bar-volume-empty          = ◦
bar-volume-indicator-font = 1
bar-volume-fill-font      = 1
bar-volume-empty-font     = 1
bar-volume-empty-foreground = ${colors.disabled}


; ==========================================================
; --- Проводная сеть (Ethernet) ---
; ==========================================================
[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
format-disconnected = 
label-connected = 󰈀 %ifname%
format-connected-padding = 1
format-connected-background = ${colors.background-alt}


; ==========================================================
; --- Беспроводная сеть (Wi-Fi) ---
; ==========================================================
[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
label-connected = %essid%
label-disconnected = 󰤮
label-disconnected-padding = 1
format-connected-padding = 1
format-connected-background = ${colors.background-alt}
format-disconnected-background = ${colors.background-alt}


; ==========================================================
; --- Выбор режима питания (для ноутбуков) ---
; ==========================================================
[module/power-profile]
type = custom/script
exec = ~/.config/polybar/scripts/power-profile.sh
; Запускать только если скрипт существует
exec-if = test -f ~/.config/polybar/scripts/power-profile.sh
interval = 5
label = %output%
label-foreground = ${colors.foreground}
label-padding = 1
label-background = ${colors.background-alt}
click-left = ~/.config/polybar/scripts/power-profile.sh --menu &


; ==========================================================
; --- Логотип Debian (запускает Rofi) ---
; ==========================================================
; Чтобы включить, добавьте `debian-logo` в `modules-left`, `modules-center` или `modules-right`.
[module/debian-logo]
type = custom/script
exec = echo ""
interval = 3600
format = <label>
label = %output%
label-font = 2
label-foreground = ${colors.primary}
label-padding = 2
click-left = rofi -show drun


; ==========================================================
; --- Кастомные закругления (Пилюли) ---
; ==========================================================
; Эти модули создают эффект закругленных краев для групп.
[module/pill-left]
type = custom/text
content = %{T2}%{T-}
content-foreground = ${colors.background-alt}
content-padding = 0
content-margin = 0

[module/pill-right]
type = custom/text
content = %{T2}%{T-}
content-foreground = ${colors.background-alt}
content-padding = 0
content-margin = 0


; ==========================================================
; --- Глобальные настройки ---
; ==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini