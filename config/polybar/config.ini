; ========================================================================================================
;                                      --- ЦВЕТА (Tokyo Night) ---
; ========================================================================================================
; Все цвета определены здесь и подставляются ниже через ${colors.имя}.
; Чтобы перекрасить панель — меняешь ТОЛЬКО эту секцию.
;
; Справка по переменным:
;
; | Переменная       | HEX        | Назначение                                      |
; |------------------|------------|-------------------------------------------------|
; |                  |            | БАЗОВЫЕ (СТОКОВЫЕ)                              |
; |------------------|------------|-------------------------------------------------|
; | background       | #1a1b26    | Основной фон панели                             |
; | background-alt   | #24283b    | Резервный фон (в TUI-панели не используется)    |
; | foreground       | #c0caf5    | Основной цвет текста                            |
; | primary          | #7aa2f7    | Главный акцент (синий)                          |
; | secondary        | #bb9af7    | Вторичный акцент (фиолетовый)                   |
; | alert            | #f7768e    | Критический уровень (красный)                   |
; | warning          | #e0af68    | Предупреждение (желтый)                         |
; | disabled         | #565f89    | Неактивный/пустой элемент                       |
; |------------------|------------|-------------------------------------------------|
; |                  |            | СЕМАНТИЧЕСКИЕ (ДОПОЛНИТЕЛЬНЫЕ)                  |
; |------------------|------------|-------------------------------------------------|
; | success          | #9ece6a    | Успех, полная батарея, активное соединение      |
; | info             | #7dcfff    | Информация, ссылки, яркость                     |
; | orange           | #ff9e64    | Второй уровень предупреждения                   |
; | error            | #db4b4b    | Темно-красный (фатальная ошибка)                |
; | teal             | #73daca    | Бирюзовый/Мятный (альтернативный акцент)        |
; | purple           | #9d7cd8    | Глубокий фиолетовый (альтернатива secondary)    |
; |------------------|------------|-------------------------------------------------|
; |                  |            | ФОНЫ ДЛЯ УГЛУБЛЕНИЯ                             |
; |------------------|------------|-------------------------------------------------|
; | bg-dark          | #16161e    | Самый темный фон (всплывающие окна)             |
; | bg-highlight     | #292e42    | Фон для подсветки строк/элементов               |
; | bg-mid           | #1f2335    | Промежуточный фон (между bg и bg-alt)           |
; |------------------|------------|-------------------------------------------------|
; |                  |            | ТЕКСТ                                           |
; |------------------|------------|-------------------------------------------------|
; | text-muted       | #a9b1d6    | Приглушенный текст (чуть темнее основного)      |
; |------------------|------------|-------------------------------------------------|
; ========================================================================================================

[colors]
; --- Базовые (стоковые) ---
; Основной фон панели
background      = #1a1b26
; Резервный фон (в TUI-панели не используется)
background-alt  = #24283b
; Основной текст
foreground      = #c0caf5
; Главный акцент (синий)
primary         = #7aa2f7
; Вторичный акцент (фиолетовый)
secondary       = #bb9af7
; Критический уровень (красный)
alert           = #f7768e
; Предупреждение (жёлтый)
warning         = #e0af68
; Неактивный/пустой
disabled        = #565f89

; --- Семантические (дополнительные) ---
; Успех / зарядка батареи
success         = #9ece6a
; Информация / ссылки
info            = #7dcfff
; Второй уровень предупреждения
orange          = #ff9e64
; Фатальная ошибка
error           = #db4b4b
; Бирюзовый (альтернатива)
teal            = #73daca
; Глубокий фиолетовый (альтернатива secondary)
purple          = #9d7cd8

; --- Дополнительные фоны ---
; Самый тёмный (для всплывающих)
bg-dark         = #16161e
; Подсветка строк/элементов
bg-highlight    = #292e42
; Промежуточный (между bg и bg-alt)
bg-mid          = #1f2335

; --- Текст ---
; Приглушённый текст
text-muted      = #a9b1d6


; ========================================================================================================
;                                --- ГЛАВНАЯ ПАНЕЛЬ: Docked Panel ---
; ========================================================================================================
; Настройки верхней панели: геометрия, шрифты, расположение модулей.
; `docked` = панель прижата к краю.
; `wm-restack = bspwm` = не перекрывает окна.

[bar/main]

; Локаль для даты и других форматов (влияет на %a/%b в module/date)
locale = ru_RU.UTF-8

; --- Геометрия панели ---
; На всю ширину экрана
width = 100%
; Панель квадратная (TUI-стиль): без скруглений
radius = 0
; Сдвиг по X от края (0 = вплотную)
offset-x = 0
; Сдвиг по Y от края (0 = вплотную)
offset-y = 0
; Толщина внешней рамки панели
border-size = 0
; Высота панели: 34px = прежние 26px + «бороды» 4+4px.
; Панель прижата к верхнему краю, без фальшивых полос сверху/снизу.
height = 34px

; --- Фон панели ---
background = ${colors.background}
foreground = ${colors.foreground}

; Высота подчёркивания под активным элементом (например, в модуле bspwm)
line-size = 2

; Внутренние отступы панели
padding-left = 0
padding-right = 1
module-margin = 0

; --- Шрифты ---
; font-0: Основной — для текста панели (проценты, дата, названия)
font-0 = JetBrainsMono Nerd Font:size=11;3
; font-1: Для иконок и полос прогресса (pixelsize — точный размер в px)
font-1 = JetBrainsMono Nerd Font:pixelsize=15;4
; font-2: Жирный — для часов и логотипа Debian (акцентные элементы)
font-2 = JetBrainsMono Nerd Font:style=Bold:size=11;3

; --- Расположение модулей ---
; Порядок в списке = порядок слева направо. Модули разделяются пробелом.
; TUI-стиль: без декоративных «пилюль», только функциональные модули.
modules-left   = debian-logo sep bspwm
modules-center = backlight date battery
modules-right  = systray sep xkeyboard sep power-profile sep pulseaudio sep wlan eth sep powermenu

; Поведение курсора мыши над панелью
; Курсор при клике — «рука»
cursor-click = pointer
; Курсор при прокрутке — вертикальный ресайз
cursor-scroll = ns-resize

; Синхронизация с BSPWM
; Включить IPC для bspc (позволяет Polybar читать состояние WM)
enable-ipc = true
; Сказать Polybar «держись поверх окон, но ниже BSPWM»
wm-restack = bspwm


; ========================================================================================================
;                                          --- МОДУЛИ ---
; ========================================================================================================


; ==========================================================
; --- Рабочие столы BSPWM ---
; ==========================================================
; TUI: только имена столов (I, II, ...), без скобок и плашек.
; Активный — акцентный цвет и подчёркивание.

[module/bspwm]
type = internal/bspwm

format = <label-state>

; Активный — акцентный текст + подчёркивание, без плашки
label-focused = %name%
label-focused-foreground = ${colors.secondary}
label-focused-background = ${colors.background}
label-focused-underline = ${colors.secondary}
label-focused-padding = 1
label-focused-margin = 0

; Занятый — обычный текст
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background}
label-occupied-padding = 1
label-occupied-margin = 0

; Срочный — «!» и красный
label-urgent = %name%!
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.background}
label-urgent-underline = ${colors.alert}
label-urgent-padding = 1
label-urgent-margin = 0

; Пустой — приглушённый текст
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}
label-empty-padding = 1
label-empty-margin = 0


; ==========================================================
; --- Яркость (Brightness / Backlight) ---
; ==========================================================
; Стоковый internal/backlight. Разделитель — часть модуля,
; поэтому на ПК (без подсветки) его нет.

[module/backlight]
type = internal/backlight
card = ${env:POLYBAR_BACKLIGHT:amdgpu_bl0}

format = <label>
format-suffix = " | "
format-suffix-foreground = ${colors.disabled}
label = BRI %percentage%%
label-foreground = ${colors.warning}

enable-scroll = true
format-background = ${colors.background}
format-padding = 1


; ==========================================================
; --- Батарея (Battery) ---
; ==========================================================
; Стоковый internal/battery. Префикс-разделитель появляется
; только вместе с модулем (на ноутбуке).

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BAT:BAT0}
adapter = ${env:POLYBAR_AC:AC}
full-at = 100
poll-interval = 3

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>

; Разделитель перед батареей (только если модуль активен)
format-prefix = " | "
format-prefix-foreground = ${colors.disabled}

; Фон = фон панели (без плашек)
format-charging-background = ${colors.background}
format-charging-padding = 1
format-discharging-background = ${colors.background}
format-discharging-padding = 1
format-full-background = ${colors.background}
format-full-padding = 1
format-low-background = ${colors.background}
format-low-padding = 1

; Текст
label-charging = BAT %percentage%%+
label-discharging = BAT %percentage%%
label-full = BAT %percentage%%=
label-low = BAT %percentage%%!

; Цвета
format-charging-foreground = ${colors.success}
format-discharging-foreground = ${colors.foreground}
format-full-foreground = ${colors.success}
format-low-foreground = ${colors.alert}

; Порог низкого заряда
low-at = 15


; ==========================================================
; --- Системный трей ---
; ==========================================================
; Иконки фоновых приложений (Telegram, Blueman, CopyQ, lxpolkit).
; Размер иконок подобран так, чтобы не раздувать панель.

[module/systray]
type = internal/tray
format = <tray>
; Расстояние между иконками
tray-spacing = 14
; Максимальный размер иконки
tray-maxsize = 18
; Принудительный размер
tray-size = 18
format-background = ${colors.background}
tray-background = ${colors.background}
format-padding = 1
tray-padding = 0


; ==========================================================
; --- Дата и время ---
; ==========================================================
; TUI: только цифры, без иконок. %{T3} — жирный шрифт для времени.

[module/date]
type = internal/date
interval = 1
date = %{T3}%H:%M%{T-} %d.%m
date-alt = %{T3}%H:%M:%S%{T-} %d.%m.%Y
label = %date%
label-foreground = ${colors.teal}
label-background = ${colors.background}
label-padding = 1


; ==========================================================
; --- Раскладка клавиатуры + индикаторы ---
; ==========================================================
; TUI: раскладка и Caps — текстом.

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-indicator> <label-layout>

label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-layout-background = ${colors.background}
label-layout-padding = 1
label-layout-margin = 0

label-indicator-on = CAPS
label-indicator-padding = 1
label-indicator-margin = 0
label-indicator-foreground = ${colors.orange}
label-indicator-background = ${colors.background}


; ==========================================================
; --- Кнопка питания ---
; ==========================================================
; TUI: текстовая кнопка PWR.

[module/powermenu]
type = custom/script
exec = echo "PWR"
format = <label>
label = %output%
label-foreground = ${colors.alert}
label-background = ${colors.background}
label-padding = 1
click-left = ~/.config/sxhkd/scripts/powermenu.sh &


; ==========================================================
; --- Регулировка звука (PulseAudio) ---
; ==========================================================
; Стоковый internal/pulseaudio (работает через pipewire-pulse).
; TUI: текст VOL/MUTE без иконок и точечной шкалы.

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-muted = <label-muted>

format-volume-background = ${colors.background}
format-muted-background = ${colors.background}
format-volume-padding = 1
format-muted-padding = 1

label-volume = VOL %percentage%%
label-volume-foreground = ${colors.info}
label-muted = MUTE
label-muted-foreground = ${colors.disabled}


; ==========================================================
; --- Проводная сеть (Ethernet) ---
; ==========================================================
; TUI: «| ETH:ifname». Разделитель внутри метки — чтобы при
; отключённом Ethernet не оставалось двойного «|».

[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
format-disconnected =
label-connected = | ETH:%ifname%
format-connected-foreground = ${colors.primary}
format-connected-padding = 1
format-connected-background = ${colors.background}


; ==========================================================
; --- Беспроводная сеть (Wi-Fi) ---
; ==========================================================
; TUI: «WIFI:ssid». SSID обрезается до 12 символов — запас под 1366px.

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = WIFI:%essid:0:12%
label-disconnected = WIFI:off
label-disconnected-padding = 1
format-connected-padding = 1
format-connected-background = ${colors.background}
format-disconnected-background = ${colors.background}
format-connected-foreground = ${colors.info}
format-disconnected-foreground = ${colors.disabled}


; ==========================================================
; --- Выбор режима питания (для ноутбуков) ---
; ==========================================================
; Вызывает power-profile.sh.
; Клик открывает Rofi-меню с выбором: Performance / Balanced / Power Saver.
; На ПК скрипта нет (симлинк не создаётся) — модуль не появится.

[module/power-profile]
type = custom/script
exec = ~/.config/polybar/scripts/power-profile.sh
; Запускать только если скрипт существует
exec-if = test -f ~/.config/polybar/scripts/power-profile.sh
; Обновлять каждые 5 сек
interval = 5
label = %output%
label-foreground = ${colors.foreground}
label-padding = 1
label-background = ${colors.background}
click-left = ~/.config/polybar/scripts/power-profile.sh --menu &


; ==========================================================
; --- Логотип Debian (запускает Rofi) ---
; ==========================================================
; TUI: текстовый логотип DEB. Клик открывает Rofi drun.
; Отступы сохранены (label-padding = 2).

[module/debian-logo]
type = custom/script
exec = echo "DEB"
interval = 3600
format = <label>
label = %output%
label-font = 2
label-foreground = ${colors.primary}
label-padding = 2
click-left = rofi -show drun


; ==========================================================
; --- Разделитель модулей (TUI) ---
; ==========================================================

[module/sep]
type = custom/text
format = |
format-foreground = ${colors.disabled}
format-padding = 0
format-margin = 0


; ==========================================================
; --- Глобальные настройки ---
; ==========================================================

[settings]
; Перезапускать Polybar при смене мониторов
screenchange-reload = true
; Эмуляция прозрачности (если нет композитора)
; Отключаем встроенную эмуляцию, чтобы Picom делал настоящую прозрачность
pseudo-transparency = false

; vim:ft=dosini