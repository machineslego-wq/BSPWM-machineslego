; ========================================================================================================
;                                      --- ЦВЕТА (Tokyo Night) ---
; ========================================================================================================
; Все цвета определены здесь и подставляются ниже через ${colors.имя}.
; Чтобы перекрасить панель — меняешь ТОЛЬКО эту секцию.
;
; Справка по переменным:
;
; | Переменная       | HEX        | Назначение                                      |
; |------------------|------------|-------------------------------------------------|
; |                  |            | БАЗОВЫЕ (СТОКОВЫЕ)                              |
; |------------------|------------|-------------------------------------------------|
; | background       | #1a1b26    | Основной фон панели                             |
; | background-alt   | #24283b    | Фон модулей (пилюль) и вкладок                  |
; | foreground       | #c0caf5    | Основной цвет текста                            |
; | primary          | #7aa2f7    | Главный акцент (синий)                          |
; | secondary        | #bb9af7    | Вторичный акцент (фиолетовый)                   |
; | alert            | #f7768e    | Критический уровень (красный)                   |
; | warning          | #e0af68    | Предупреждение (желтый)                         |
; | disabled         | #565f89    | Неактивный/пустой элемент                       |
; |------------------|------------|-------------------------------------------------|
; |                  |            | СЕМАНТИЧЕСКИЕ (ДОПОЛНИТЕЛЬНЫЕ)                  |
; |------------------|------------|-------------------------------------------------|
; | success          | #9ece6a    | Успех, полная батарея, активное соединение      |
; | info             | #7dcfff    | Информация, ссылки, яркость                     |
; | orange           | #ff9e64    | Второй уровень предупреждения                   |
; | error            | #db4b4b    | Темно-красный (фатальная ошибка)                |
; | teal             | #73daca    | Бирюзовый/Мятный (альтернативный акцент)        |
; | purple           | #9d7cd8    | Глубокий фиолетовый (альтернатива secondary)    |
; |------------------|------------|-------------------------------------------------|
; |                  |            | ФОНЫ ДЛЯ УГЛУБЛЕНИЯ                             |
; |------------------|------------|-------------------------------------------------|
; | bg-dark          | #16161e    | Самый темный фон (всплывающие окна)             |
; | bg-highlight     | #292e42    | Фон для подсветки строк/элементов               |
; | bg-mid           | #1f2335    | Промежуточный фон (между bg и bg-alt)           |
; |------------------|------------|-------------------------------------------------|
; |                  |            | ТЕКСТ                                           |
; |------------------|------------|-------------------------------------------------|
; | text-muted       | #a9b1d6    | Приглушенный текст (чуть темнее основного)      |
; |------------------|------------|-------------------------------------------------|
; ========================================================================================================

[colors]
; --- Базовые (стоковые) ---
; Основной фон панели
background      = #1a1b26
; Фон модулей (пилюль)
background-alt  = #24283b
; Основной текст
foreground      = #c0caf5
; Главный акцент (синий)
primary         = #7aa2f7
; Вторичный акцент (фиолетовый)
secondary       = #bb9af7
; Критический уровень (красный)
alert           = #f7768e
; Предупреждение (жёлтый)
warning         = #e0af68
; Неактивный/пустой
disabled        = #565f89

; --- Семантические (дополнительные) ---
; Успех / зарядка батареи
success         = #9ece6a
; Информация / ссылки
info            = #7dcfff
; Второй уровень предупреждения
orange          = #ff9e64
; Фатальная ошибка
error           = #db4b4b
; Бирюзовый (альтернатива)
teal            = #73daca
; Глубокий фиолетовый (альтернатива secondary)
purple          = #9d7cd8

; --- Дополнительные фоны ---
; Самый тёмный (для всплывающих)
bg-dark         = #16161e
; Подсветка строк/элементов
bg-highlight    = #292e42
; Промежуточный (между bg и bg-alt)
bg-mid          = #1f2335

; --- Текст ---
; Приглушённый текст
text-muted      = #a9b1d6


; ========================================================================================================
;                                --- ГЛАВНАЯ ПАНЕЛЬ: Docked Panel ---
; ========================================================================================================
; Настройки верхней панели: геометрия, шрифты, расположение модулей.
; `docked` = панель прижата к краю.
; `wm-restack = bspwm` = не перекрывает окна.

[bar/main]

; Локаль для даты и других форматов (влияет на %a/%b в module/date)
locale = ru_RU.UTF-8

; --- Геометрия панели ---
; На всю ширину экрана
width = 100%
; Без скруглений всей панели (скругления дают pill-модули)
radius = 0
; Сдвиг по X от края (0 = вплотную)
offset-x = 0
; Сдвиг по Y от края (0 = вплотную)
offset-y = 0
; Толщина внешней рамки панели
border-size = 0
; Высота панели
height = 26px

; Фальшивые отступы сверху и снизу (по 4 пикселя),
; чтобы панель не прилипала к краям экрана.
border-top-size = 4
border-bottom-size = 4
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}

; --- Фон панели ---
background = ${colors.background}
foreground = ${colors.foreground}

; Высота подчёркивания под активным элементом (например, в модуле bspwm)
line-size = 2

; Внутренние отступы панели
padding-left = 0
padding-right = 1
module-margin = 0

; --- Шрифты ---
; font-0: Основной — для текста панели (проценты, дата, названия)
font-0 = JetBrainsMono Nerd Font:size=12;3
; font-1: Для иконок и закруглений по краям «пилюль» (pixelsize — точный размер в px)
font-1 = JetBrainsMono Nerd Font:pixelsize=15;4
; font-2: Жирный — для часов и логотипа Debian (акцентные элементы)
font-2 = JetBrainsMono Nerd Font:style=Bold:size=12;3

; --- Расположение модулей ---
; Порядок в списке = порядок слева направо. Модули разделяются пробелом.
; pill-left/pill-right — декоративные закругления вокруг групп модулей.
modules-left   = debian-logo pill-left bspwm pill-right
modules-center = pill-left brightness date battery pill-right
modules-right  = pill-left systray xkeyboard power-profile pulseaudio eth wlan powermenu pill-right

; Поведение курсора мыши над панелью
; Курсор при клике — «рука»
cursor-click = pointer
; Курсор при прокрутке — вертикальный ресайз
cursor-scroll = ns-resize

; Синхронизация с BSPWM
; Включить IPC для bspc (позволяет Polybar читать состояние WM)
enable-ipc = true
; Сказать Polybar «держись поверх окон, но ниже BSPWM»
wm-restack = bspwm


; ========================================================================================================
;                                          --- МОДУЛИ ---
; ========================================================================================================


; ==========================================================
; --- Рабочие столы BSPWM ---
; ==========================================================
; Показывает 10 рабочих столов с состояниями: focused / occupied / urgent / empty.
; Каждое состояние — свой цвет и иконка.

[module/bspwm]
type = internal/bspwm

; Иконки рабочих столов (Номер стола;Символ)
ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7
ws-icon-7 = VIII;8
ws-icon-8 = IX;9
ws-icon-9 = X;0

; Формат вывода (только label-state, иконки берутся из ws-icon)
format = <label-state>

; --- Состояния рабочих столов ---
; Единый фон (bg-mid) для всех состояний — чтобы «пилюля» выглядела цельно.

; Активный (в фокусе) — синий, с подчёркиванием
label-focused = %icon%
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.bg-mid}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-focused-margin = 0

; Занятый (есть окна, но не в фокусе) — обычный текст
label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.bg-mid}
label-occupied-padding = 1
label-occupied-margin = 0

; Срочный (окно требует внимания) — жёлтый фон
label-urgent = %icon%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.warning}
label-urgent-padding = 1
label-urgent-margin = 0

; Пустой (нет окон) — приглушённый текст
label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.bg-mid}
label-empty-padding = 1
label-empty-margin = 0


; ==========================================================
; --- Яркость (Brightness) ---
; ==========================================================
; Кастомный скрипт, потому что стоковый модуль яркости в Polybar
; не умеет красиво выводить иконку + процент + полосу.
; Подробности — в ~/.config/polybar/scripts/brightness.sh

[module/brightness]
type = custom/script
; Проверяем, существует ли папка с устройствами подсветки.
; Если папки нет (как на ПК), модуль просто исчезнет из панели.
exec-if = ls /sys/class/backlight/* >/dev/null 2>&1
exec = ~/.config/polybar/scripts/brightness.sh
; Скрипт работает в режиме «потока» (выводит только при изменении)
tail = true
format = <label>
label = %output%
label-foreground = ${colors.foreground}
label-background = ${colors.bg-mid}
label-padding = 1
; Прокрутка колесом над модулем — регулировка яркости
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-


; ==========================================================
; --- Батарея (Battery) ---
; ==========================================================
; Используется стоковый модуль internal/battery.
; Имя батареи (BAT0/BAT1) и адаптера (AC/ADP1) определяются автоматически
; в launch.sh и передаются сюда через переменные окружения POLYBAR_BAT / POLYBAR_AC.
;
; АЛЬТЕРНАТИВА: если стоковый модуль не видит батарею (редкий случай),
; раскомментируйте скрипт ниже и закомментируйте блок [module/battery].
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
; Режим «потока»: выводит только при изменении состояния
tail = true
format = <label>
label = %output%
label-background = ${colors.bg-mid}
label-padding = 1
; Клик — подробности (ёмкость, статус, время, здоровье)
click-left = ~/.config/polybar/scripts/battery.sh --details &

; [module/battery]
; type = internal/battery

; ; ${env:POLYBAR_BAT:BAT0} = взять из переменной POLYBAR_BAT, иначе «BAT0»
; battery = ${env:POLYBAR_BAT:BAT0}
; adapter = ${env:POLYBAR_AC:AC}

; ; При 100% считать «полностью заряжено»
; full-at = 100
; ; Проверять состояние каждые 3 секунды
; poll-interval = 3

; ; --- Форматы вывода (свой для каждого состояния) ---
; ; Зарядка — анимация + проценты
; format-charging     = <animation-charging> <label-charging>
; ; Разрядка — иконка + проценты
; format-discharging  = <ramp-capacity> <label-discharging>
; ; Полный — иконка + проценты
; format-full         = <ramp-capacity> <label-full>

; ; --- Фон и отступы ---
; format-charging-background    = ${colors.bg-mid}
; format-charging-padding       = 1
; format-discharging-background = ${colors.bg-mid}
; format-discharging-padding    = 1
; format-full-background        = ${colors.bg-mid}
; format-full-padding           = 1

; ; --- Цвета текста ---
; ; При разрядке — светлый
; label-discharging-foreground = ${colors.foreground}
; ; При зарядке — зелёный
; format-charging-foreground   = ${colors.success}
; ; Полный — зелёный
; format-full-foreground       = ${colors.success}

; ; --- Текст (только проценты) ---
; label-charging    = %percentage%%
; label-discharging = %percentage%%
; label-full        = %percentage%%

; ; --- Анимация зарядки (7 кадров) ---
; animation-charging-0 = 󰂆
; animation-charging-1 = 󰂇
; animation-charging-2 = 󰂈
; animation-charging-3 = 󰂉
; animation-charging-4 = 󰂊
; animation-charging-5 = 󰂋
; animation-charging-6 = 󰂅
; ; мс между кадрами (600 = ~1.6 fps, спокойно)
; animation-charging-framerate = 600

; ; --- Иконки разрядки (11 уровней: 0–10) ---
; ramp-capacity-0  = 󰂃
; ramp-capacity-1  = 󰁺
; ramp-capacity-2  = 󰁻
; ramp-capacity-3  = 󰁼
; ramp-capacity-4  = 󰁽
; ramp-capacity-5  = 󰁾
; ramp-capacity-6  = 󰁿
; ramp-capacity-7  = 󰂀
; ramp-capacity-8  = 󰂁
; ramp-capacity-9  = 󰂂
; ramp-capacity-10 = 󰁹

; ; --- Цвета иконок при разрядке (по уровням) ---
; ; 0-2 (0-29%): Красный
; ramp-capacity-0-foreground = ${colors.alert}
; ramp-capacity-1-foreground = ${colors.alert}
; ramp-capacity-2-foreground = ${colors.alert}
; ; 3-5 (30-59%): Жёлтый
; ramp-capacity-3-foreground = ${colors.warning}
; ramp-capacity-4-foreground = ${colors.warning}
; ramp-capacity-5-foreground = ${colors.warning}
; ; 6-10 (60-100%): Синий
; ramp-capacity-6-foreground  = ${colors.primary}
; ramp-capacity-7-foreground  = ${colors.primary}
; ramp-capacity-8-foreground  = ${colors.primary}
; ramp-capacity-9-foreground  = ${colors.primary}
; ramp-capacity-10-foreground = ${colors.primary}


; ==========================================================
; --- Системный трей ---
; ==========================================================
; Иконки фоновых приложений (Telegram, Blueman, CopyQ, lxpolkit).
; Размер иконок подобран так, чтобы не раздувать «пилюлю».

[module/systray]
type = internal/tray
format = <tray>
; Расстояние между иконками
tray-spacing = 14
; Максимальный размер иконки
tray-maxsize = 18
; Принудительный размер
tray-size = 18
format-background = ${colors.bg-mid}
tray-background = ${colors.bg-mid}
format-padding = 1
tray-padding = 0


; ==========================================================
; --- Дата и время ---
; ==========================================================
; Формат даты настроен под русскую локаль. При желании можно
; поменять на ISO (%Y-%m-%d) или другие форматы strftime.
; %{T3}...%{T-} = переключиться на шрифт font-2 (жирный) только для этих символов.

[module/date]
type = internal/date
; Обновлять каждую секунду
interval = 1
; Пример: 14:30 Пн, 26 Окт
date = %{T3}%H:%M%{T-} %a, %{T3}%d%{T-} %b
date-alt =  %{T3}%H:%M%{T-}:%S 󰃭 %{T3}%d.%m%{T-}.%Y
label = %date%
label-foreground = ${colors.primary}
label-background = ${colors.bg-mid}
label-padding = 1


; ==========================================================
; --- Раскладка клавиатуры + индикаторы ---
; ==========================================================
; Показывает текущую раскладку (us/ru) и зажатые модификаторы (Caps, Num, Scroll).
; Порядок вывода задаётся в format — сначала индикаторы, потом раскладка.
;
; ВАЖНО: Если Caps Lock переключает язык (через setxkbmap в bspwmrc),
; не добавляйте его в blacklist, иначе индикатор будет мигать при смене языка.

[module/xkeyboard]
type = internal/xkeyboard
; Не показывать индикатор Num Lock
blacklist-0 = num lock
; Не показывать индикатор Scroll Lock
blacklist-1 = scroll lock
; blacklist-2 = caps lock  (раскомментировать, если Caps Lock НЕ должен светиться)

; --- Формат вывода ---
; <label-indicator> — индикатор зажатых клавиш (например, «Caps»)
; <label-layout>    — текущая раскладка (us, ru)
format = <label-indicator><label-layout>

; --- Раскладка ---
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-layout-background = ${colors.bg-mid}
label-layout-padding = 1
label-layout-margin = 0

; --- Индикатор Caps Lock ---
; (символ  = Nerd Font-иконка «caps lock»)
label-indicator =  Caps
label-indicator-padding = 1
label-indicator-margin = 0
label-indicator-foreground = ${colors.warning}
label-indicator-background = ${colors.bg-mid}


; ==========================================================
; --- Кнопка питания ---
; ==========================================================
; Иконка в правой части панели. Клик открывает Rofi-меню питания.

[module/powermenu]
type = custom/script
; Иконка (power symbol)
exec = echo "󰤆"
format = <label>
label = %output%
label-foreground = ${colors.primary}
label-background = ${colors.bg-mid}
label-padding = 1
click-left = ~/.config/sxhkd/scripts/powermenu.sh &


; ==========================================================
; --- Регулировка звука (PulseAudio) ---
; ==========================================================
; Стоковый модуль PulseAudio. Несмотря на название, работает и с PipeWire,
; потому что pipewire-pulse предоставляет совместимый PulseAudio-API.
; OSD при изменении громкости — через ~/.config/sxhkd/scripts/volume.sh.

[module/pulseaudio]
type = internal/pulseaudio

; Формат вывода
; Обычный режим: иконка + % + полоса
format-volume = <ramp-volume> <label-volume> <bar-volume>
; Мут: иконка + полоса
format-muted  = <label-muted> <bar-volume>

; Фон
format-volume-background = ${colors.bg-mid}
format-muted-background = ${colors.bg-mid}

; Отступы
format-muted-padding = 1
format-volume-padding = 1

; Иконки громкости (5 уровней)
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾
ramp-volume-4 = 󰕾

; Индикатор мута
label-muted = 󰝟 %percentage%%
label-muted-foreground = ${colors.disabled}

; Проценты
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

; --- Полоса прогресса громкости ---
bar-volume-width = 5
; Цвета полосы по уровням (0–10): синий → жёлтый → красный
bar-volume-foreground-0 = ${colors.primary}
bar-volume-foreground-1 = ${colors.primary}
bar-volume-foreground-2 = ${colors.primary}
bar-volume-foreground-3 = ${colors.primary}
bar-volume-foreground-4 = ${colors.primary}
bar-volume-foreground-5 = ${colors.primary}
bar-volume-foreground-6 = ${colors.warning}
bar-volume-foreground-7 = ${colors.warning}
bar-volume-foreground-8 = ${colors.warning}
bar-volume-foreground-9 = ${colors.alert}
bar-volume-foreground-10 = ${colors.alert}
; Не смешивать цвета между уровнями (чёткие границы)
bar-volume-gradient = false

; АЛЬТЕРНАТИВА: индикаторы в виде прямоугольников
# bar-volume-indicator      = █
# bar-volume-fill           = ▓
# bar-volume-empty          = ▒

; ТЕКУЩИЙ ВАРИАНТ: индикаторы в виде кружков
; Заполненный сегмент под курсором
bar-volume-indicator      = •
; Заполненные сегменты
bar-volume-fill           = •
; Пустые сегменты
bar-volume-empty          = ◦
; Эти символы отрисовываются шрифтом font-1 (для чёткости кружков)
bar-volume-indicator-font = 1
bar-volume-fill-font      = 1
bar-volume-empty-font     = 1
bar-volume-empty-foreground = ${colors.disabled}


; ==========================================================
; --- Проводная сеть (Ethernet) ---
; ==========================================================
; Показывает имя проводного интерфейса, когда он подключён.
; Когда отключён — пустая строка (модуль исчезает).

[module/eth]
type = internal/network
; Искать интерфейсы типа «проводной»
interface-type = wired
; Проверять каждые 3 секунды
interval = 3
format-connected = <label-connected>
; Пусто = не показывать при отключении
format-disconnected =
;  = иконка ethernet, %ifname% = имя (eth0, enp3s0...)
label-connected = 󰈀 %ifname%
format-connected-padding = 1
format-connected-background = ${colors.bg-mid}


; ==========================================================
; --- Беспроводная сеть (Wi-Fi) ---
; ==========================================================
; Показывает SSID и уровень сигнала. При отключении — иконка «нет сети».

[module/wlan]
type = internal/network
; Искать беспроводные интерфейсы
interface-type = wireless
interval = 3
; Подключён: иконка сигнала + SSID
format-connected = <ramp-signal> <label-connected>
; Отключён: иконка «нет сети»
format-disconnected = <label-disconnected>

; Иконки уровня сигнала (5 уровней)
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

; SSID текущей сети
label-connected = %essid%
; Иконка «нет сети»
label-disconnected = 󰤮
label-disconnected-padding = 1
format-connected-padding = 1
format-connected-background = ${colors.bg-mid}
format-disconnected-background = ${colors.bg-mid}


; ==========================================================
; --- Выбор режима питания (для ноутбуков) ---
; ==========================================================
; Вызывает power-profile.sh.
; Клик открывает Rofi-меню с выбором: Performance / Balanced / Power Saver.
; На ПК скрипта нет (симлинк не создаётся) — модуль не появится.

[module/power-profile]
type = custom/script
exec = ~/.config/polybar/scripts/power-profile.sh
; Запускать только если скрипт существует
exec-if = test -f ~/.config/polybar/scripts/power-profile.sh
; Обновлять каждые 5 сек
interval = 5
label = %output%
label-foreground = ${colors.foreground}
label-padding = 1
label-background = ${colors.bg-mid}
click-left = ~/.config/polybar/scripts/power-profile.sh --menu &


; ==========================================================
; --- Логотип Debian (запускает Rofi) ---
; ==========================================================
; Декоративная иконка слева. Клик открывает Rofi drun (то же, что Super+D).
; Чтобы включить, добавьте `debian-logo` в modules-left/center/right.

[module/debian-logo]
type = custom/script
; Nerd Font-иконка Debian
exec = echo ""
; Обновлять раз в час (можно 0 = никогда)
interval = 3600
format = <label>
label = %output%
; Жирный шрифт (font-2)
label-font = 2
label-foreground = ${colors.primary}
label-padding = 2
click-left = rofi -show drun


; ==========================================================
; --- Кастомные закругления (Пилюли) ---
; ==========================================================
; Модули-«декор»: добавляют закруглённые края вокруг групп модулей.
; Работают за счёт Nerd Font-символов  и  (левая/правая половина скругления).
; Цвет совпадает с bg-mid — поэтому выглядят как часть «пилюли».

[module/pill-left]
type = custom/text
; Левая скобка «пилюли» (шрифт font-2)
content = %{T2}%{T-}
content-foreground = ${colors.bg-mid}
content-padding = 0
content-margin = 0

[module/pill-right]
type = custom/text
; Правая скобка «пилюли»
content = %{T2}%{T-}
content-foreground = ${colors.bg-mid}
content-padding = 0
content-margin = 0


; ==========================================================
; --- Глобальные настройки ---
; ==========================================================

[settings]
; Перезапускать Polybar при смене мониторов
screenchange-reload = true
; Эмуляция прозрачности (если нет композитора)
pseudo-transparency = true

; vim:ft=dosini