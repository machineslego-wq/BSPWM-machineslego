# --- Бэкенд и производительность ---
# Для Intel UHD 600 лучший выбор — xrender, он стабильнее и легче, чем glx.
# Но с glx правильно работают скругления
backend = "glx";
vsync = true;

# Отключаем самые тяжёлые эффекты
blur-background = false;
shadow = false;
fading = false;

# --- Скругление углов ---
corner-radius = 15;
round-borders = 15;
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'"
];

# --- Прозрачность ---
# Лёгкая прозрачность для терминала. Можно убрать, если не нужна.
opacity-rule = [
    "95:class_g = 'Alacritty'",
    "90:class_g = 'Rofi'"
];

# --- Устранение артефактов ---
# Помогает, если при выходе из полноэкранного режима пропадают скругления
no-ewmh-fullscreen = true;