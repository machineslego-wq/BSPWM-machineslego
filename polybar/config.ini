;   go to https://github.com/polybar/polybar
;
;==========================================================

;==========================================================
; ЦВЕТА (Tokyo Night)
;==========================================================

[colors]
background      = #1a1b26
background-alt  = #24283b
foreground      = #c0caf5
primary         = #7aa2f7
secondary       = #bb9af7
alert           = #f7768e
warning         = #e0af68
disabled        = #565f89


;==========================================================
; ГЛАВНАЯ ПАНЕЛЬ
;==========================================================
[bar/main]

; --- "Парящая" панель с рамкой и скруглением ---
width = 99%
radius = 10
offset-x = 0.5%
offset-y = 2
border-size = 2
border-color = #7aa2f7
height = 36px

; Фон с прозрачностью
background = #e61a1b26
foreground = ${colors.foreground}

line-size = 2pt

padding-left = 0
padding-right = 0

module-margin = 0

separator =
separator-foreground = ${colors.disabled}

; --- Шрифт ---
font-0 = JetBrainsMono Nerd Font;2
font-1 = JetBrainsMono Nerd Font:size=16;4

; --- Активные модули ---
modules-left = bspwm
modules-center = brightness date battery
modules-right = systray eth wlan pulseaudio xkeyboard powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm

; override-redirect = true

;==========================================================
; РАСПОЛОЖЕНИЕ ОКОН ПОД ПАНЕЛЬЮ
;==========================================================
[global/wm]
margin-top = 32px
margin-bottom = 0

;==========================================================
; МОДУЛИ
;==========================================================

; --- Рабочие столы BSPWM ---
[module/bspwm]
type = internal/bspwm

ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7

format = <label-state>

label-focused = %icon%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = %icon%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

; --- Яркость ---
[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
tail = true
label = %output%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

; --- Батарея ---
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
tail = true
label = %output%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1
click-left = acpi -b | rofi -dmenu -p "Battery" &

; --- Системный трей  ---
[module/systray]
type = internal/tray
format-margin = 1
tray-spacing = 16
tray-maxsize = 18
tray-size = 18

; --- Дата ---
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d.%m.%Y %H:%M:%S
label = %date%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1

; --- Раскладка + индикаторы ---
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-layout-padding = 2
label-layout-margin = 0

label-indicator-padding = 2
label-indicator-margin = 0
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

; --- Кнопка питания (раскрывное меню) ---
[module/powermenu]
type = custom/menu
expand-right = false

label-open = 󰐥
label-open-background = ${colors.primary}
label-open-foreground = ${colors.background}
label-open-padding = 2

label-close = x
label-close-background = ${colors.alert}
label-close-foreground = ${colors.background}
label-close-padding = 2

; --- Кнопки меню (раскрытие влево) ---

menu-0-2 = 󰍃 LOG
menu-0-2-background = ${colors.secondary}
menu-0-2-foreground = ${colors.background}
menu-0-2-padding = 2
menu-0-2-exec = rofi -dmenu -p "Выйти? (y/n)" | grep -qi "^y" && loginctl terminate-user $USER

menu-0-1 = 󰜉 REB
menu-0-1-background = ${colors.warning}
menu-0-1-foreground = ${colors.background}
menu-0-1-padding = 2
menu-0-1-exec = rofi -dmenu -p "Перезагрузить? (y/n)" | grep -qi "^y" && systemctl reboot

menu-0-0 = 󰐥 PWR
menu-0-0-background = ${colors.alert}
menu-0-0-foreground = ${colors.background}
menu-0-0-padding = 2
menu-0-0-exec = rofi -dmenu -p "Выключить? (y/n)" | grep -qi "^y" && systemctl poweroff

[module/pulseaudio]
type = internal/pulseaudio

; Оборачиваем ramp-volume в крупный шрифт font-1
format-volume = <ramp-volume> <label-volume> <bar-volume>
format-muted  = <label-muted> <bar-volume>

; Иконки громкости — БЕЗ тегов внутри, они снаружи
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾
ramp-volume-4 = 󰕾

; Иконка мута — тоже без тегов внутри
label-muted = 󰝟 %percentage%%
label-muted-foreground = ${colors.disabled}

; Проценты — обычный шрифт (font-0 по умолчанию)
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

; Полоса прогресса
bar-volume-width = 5
bar-volume-foreground-0 = ${colors.primary}
bar-volume-foreground-1 = ${colors.primary}
bar-volume-foreground-2 = ${colors.primary}
bar-volume-foreground-3 = ${colors.primary}
bar-volume-foreground-4 = ${colors.primary}
bar-volume-foreground-5 = ${colors.warning}
bar-volume-foreground-6 = ${colors.warning}
bar-volume-foreground-7 = ${colors.warning}
bar-volume-foreground-8 = ${colors.alert}
bar-volume-foreground-9 = ${colors.alert}
bar-volume-gradient = false
bar-volume-indicator = ▓
bar-volume-indicator-font = 2
bar-volume-fill = ▓
bar-volume-fill-font = 2
bar-volume-empty = ▒
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.disabled}

; --- Модуль проводной сети ---
[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
format-disconnected = 
label-connected = 󰈀 %ifname%

; --- Модуль беспроводной сети ---
[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
label-connected = %essid%
label-disconnected = 󰤮
label-disconnected-padding = 2
format-connected-padding = 2

; --- Индикатор блютуза зависящий от скрипта ---
; Пока убрал значок блютуза, дабы не дублировать функционал
[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
label = %output%
label-foreground = ${colors.foreground}
click-left = blueman-manager &

;==========================================================
; НАСТРОЙКИ
;==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini