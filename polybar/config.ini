;==========================================================

;==========================================================
; ЦВЕТА (Tokyo Night)
;==========================================================

[colors]
background      = #1a1b26
background-alt  = #24283b
foreground      = #c0caf5
primary         = #7aa2f7
secondary       = #bb9af7
alert           = #f7768e
warning         = #e0af68
disabled        = #565f89


;==========================================================
; ГЛАВНАЯ ПАНЕЛЬ
;==========================================================
[bar/main]

; --- «Парящая» панель с рамкой и скруглением (текущий) ---
width = 99%
radius = 10
offset-x = 0.5%
offset-y = 2
border-size = 2
border-color = #7aa2f7
height = 36px

; Фон с прозрачностью
background = #e61a1b26
foreground = ${colors.foreground}

line-size = 2pt

padding-left = 0
padding-right = 0

module-margin = 0

separator =
separator-foreground = ${colors.disabled}

; --- Шрифт ---
font-0 = JetBrainsMono Nerd Font;2

; --- Активные модули ---
modules-left = bspwm
modules-center = brightness date battery
modules-right = systray xkeyboard powermenu

; --- Стоковые модули (закомментированы) ---
; modules-left = xworkspaces xwindow
; modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm

; override-redirect = true

;==========================================================
; РАСПОЛОЖЕНИЕ ОКОН ПОД ПАНЕЛЬЮ
;==========================================================
[global/wm]
; margin-top = 28   ; для «парящей» панели (вариант 1)
margin-top = 32px     ; для бара сверху (вариант 2, = height)
margin-bottom = 0

;==========================================================
; МОДУЛИ
;==========================================================

; --- Рабочие столы BSPWM ---
[module/bspwm]
type = internal/bspwm

ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7

format = <label-state>

label-focused = %icon%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = %icon%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

; --- Яркость ---
[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
tail = true
label = %output%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

; --- Батарея ---
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
tail = true
label = %output%
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 1
click-left = acpi -b | rofi -dmenu -p "Battery" &

; --- Трей для апплетов (Wi-Fi, Bluetooth, звук) ---
[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt
tray-maxsize = 22

; --- Дата ---
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d.%m.%Y %H:%M:%S
label = %date%
label-foreground = ${colors.primary}
label-padding = 1
label-background = ${colors.background-alt}

; --- Раскладка + индикаторы ---
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}
; label-layout-background = ${colors.background}
label-layout-padding = 2
label-layout-margin = 0

label-indicator-padding = 2
label-indicator-margin = 0
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

; --- Кнопка питания (раскрывное меню) ---
[module/powermenu]
type = custom/menu
expand-right = false

label-open = 󰐥
label-open-background = ${colors.primary}
label-open-foreground = ${colors.background}
label-open-padding = 2

label-close = x
label-close-background = ${colors.alert}
label-close-foreground = ${colors.background}
label-close-padding = 2

; --- Кнопки меню (раскрытие влево) ---

menu-0-2 = 󰍃 LOG
menu-0-2-background = ${colors.secondary}
menu-0-2-foreground = ${colors.background}
menu-0-2-padding = 2
menu-0-2-exec = rofi -dmenu -p "Выйти? (y/n)" | grep -qi "^y" && loginctl terminate-user $USER

menu-0-1 = 󰜉 REB
menu-0-1-background = ${colors.warning}
menu-0-1-foreground = ${colors.background}
menu-0-1-padding = 2
menu-0-1-exec = rofi -dmenu -p "Перезагрузить? (y/n)" | grep -qi "^y" && systemctl reboot

menu-0-0 = 󰐥 PWR
menu-0-0-background = ${colors.alert}
menu-0-0-foreground = ${colors.background}
menu-0-0-padding = 2
menu-0-0-exec = rofi -dmenu -p "Выключить? (y/n)" | grep -qi "^y" && systemctl poweroff

;==========================================================
; НАСТРОЙКИ
;==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini